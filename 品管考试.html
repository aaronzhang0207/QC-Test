<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>品管考试 · 品管智能体</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --card:#fff; --text:#14202b; --muted:#6c7d8d; --line:#e3e9ef;
  --accent:#0f8f7a; --accent-ink:#fff; --accent-soft:#e4f5f1; --danger:#c2410c; --ok:#0f8f7a; --warn:#e08a1e;
  --shadow:0 1px 2px rgba(20,32,43,.05), 0 10px 26px rgba(20,32,43,.07);
  --r:14px; --bg-glow-1:rgba(15,143,122,.07); --bg-glow-2:rgba(43,123,229,.06);
}
html[data-theme="dark"]{
  --bg:#0e1520; --panel:#151f2c; --card:#1a2634; --text:#e7eef6; --muted:#8ea1b5; --line:#25344a;
  --accent:#2ad0ae; --accent-ink:#06231d; --accent-soft:#123039; --danger:#fb923c; --ok:#2ad0ae; --warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.35);
  --bg-glow-1:rgba(42,208,174,.10); --bg-glow-2:rgba(123,97,255,.07);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",
       "Noto Sans Khmer","Khmer OS Battambang","Khmer OS","Leelawadee UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1200px 620px at 8% -10%,var(--bg-glow-1),transparent 60%),
             radial-gradient(1000px 560px at 102% 0%,var(--bg-glow-2),transparent 55%);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.app{display:flex;min-height:100%}
/* sidebar */
.side{width:206px;flex:0 0 206px;background:var(--panel);border-right:1px solid var(--line);
  padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 16px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7dd3c0);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;box-shadow:0 4px 12px -2px rgba(15,143,122,.25)}
.brand b{font-size:15px;letter-spacing:.3px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:9px 10px;
  border-radius:10px;text-align:left;font-size:13.5px;color:var(--muted);width:100%}
.nav button:hover{background:var(--accent-soft);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.65}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--bg);border:1px solid var(--line);
  border-radius:20px;padding:1px 7px;color:var(--muted)}
.side .sep{height:1px;background:var(--line);margin:12px 6px}
.side .foot{font-size:11px;color:var(--muted);padding:10px 8px;line-height:1.8}
/* main */
.main{flex:1;min-width:0;padding:18px 26px 60px;max-width:1500px;margin:0 auto}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:9px 13px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 12px;
  font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.langseg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
.langseg button{border:0;background:transparent;padding:9px 12px;font-size:13px;color:var(--muted)}
.langseg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
h1{font-size:26px;margin:4px 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;
  font-size:12.5px;color:var(--muted)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease,border-color .12s ease;position:relative}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .num{position:absolute;right:14px;top:12px;font-size:11px;color:var(--muted);opacity:.7}
.card .hd{display:flex;gap:11px;align-items:flex-start;padding-right:18px}
.tile{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;
  font-weight:700;font-size:17px;background:var(--accent-soft);color:var(--accent)}
.card h3{margin:1px 0 2px;font-size:16px;line-height:1.3}
.card .tag{display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-soft);
  border-radius:5px;padding:1px 6px;margin-top:2px}
.card p{margin:11px 0 0;color:var(--muted);font-size:12.5px;line-height:1.6;min-height:38px}
.card .bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.card .go{color:var(--accent);font-weight:600}
/* exam */
.wrap{max-width:920px;margin:0 auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.examhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px}
.pill.timer{color:var(--warn);font-variant-numeric:tabular-nums;font-weight:600}
.progress{height:7px;background:var(--bg);border-radius:999px;overflow:hidden;margin:8px 0 20px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7dd3c0);width:0;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap}
.qtext{font-size:19px;line-height:1.55;font-weight:600;margin:0 0 10px}
.qtext .km{display:block;font-size:16px;font-weight:500;color:var(--muted);margin-top:6px;line-height:1.9}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);background:var(--card);
  border-radius:12px;padding:13px 15px;text-align:left;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .k{width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:1px}
.opt .txt{flex:1;line-height:1.55}
.opt .txt .km{display:block;color:var(--muted);font-size:13px;line-height:1.9;margin-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:rgba(15,143,122,.08)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--danger);background:rgba(194,65,12,.07)}
.opt.wrong .k{background:var(--danger);border-color:var(--danger);color:#fff}
.examnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 18px;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{opacity:.92;color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.dots button{width:29px;height:29px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  font-size:12px;color:var(--muted)}
.dots button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.dots button.cur{outline:2px solid var(--accent);outline-offset:1px}
/* result */
.score{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:16px}
.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--bg) 0);position:relative}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}
.ring b{position:relative;z-index:1;font-size:28px;line-height:1}
.ring small{position:relative;z-index:1;font-size:11px;color:var(--muted);margin-top:3px}
.verdict{font-size:22px;font-weight:700;margin:0 0 4px}
.verdict.pass{color:var(--ok)}
.verdict.fail{color:var(--danger)}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--muted)}
.stat b{color:var(--text);font-size:15px;margin-right:3px}
.review{margin-top:22px}
.review .rq{border-top:1px solid var(--line);padding:16px 0}
.review .rq:first-child{border-top:0}
.review .rq .qt{font-weight:600;margin-bottom:7px}
.review .rq .kmline{color:var(--muted);font-size:13px;margin-bottom:8px}
.review .ans{font-size:13.5px;margin:3px 0}
.review .ans.ok{color:var(--ok)}
.review .ans.ng{color:var(--danger)}
.review .exp{font-size:13px;color:var(--muted);background:var(--bg);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:8px 11px;margin-top:7px;line-height:1.75}
.hist{display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 15px;box-shadow:var(--shadow);cursor:pointer}
.hrow:hover{border-color:var(--accent)}
.hrow .hs{width:52px;text-align:center;font-weight:700;font-size:17px}
.hrow .hd{flex:1;min-width:0}
.hrow .hd b{font-size:14px}
.hrow .hd small{display:block;color:var(--muted);font-size:12px}
.hrow .badge{font-size:11px;border-radius:999px;padding:2px 9px;font-weight:600}
.badge.pass{background:var(--accent-soft);color:var(--accent)}
.badge.fail{background:rgba(194,65,12,.1);color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
.note{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:13px 15px;
  font-size:13px;line-height:1.8;color:var(--text)}
.note b{color:var(--accent)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:13.5px;margin-top:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.section-title{font-size:14px;font-weight:700;margin:24px 0 10px;letter-spacing:.2px}
.setup{max-width:720px}
.setuprow{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--text);outline:none;min-width:220px}
.field input:focus{border-color:var(--accent)}
@media (max-width:820px){
  .app{display:block}
  .side{width:auto;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);
    padding:12px;display:flex;gap:10px;align-items:center;overflow-x:auto}
  .brand{padding:0 8px 0 0;flex:0 0 auto}
  .brand b{white-space:nowrap}
  .brand small{display:none}
  .nav{flex-direction:row;gap:4px;overflow-x:auto;padding-bottom:2px}
  .nav button{width:auto;flex:0 0 auto;white-space:nowrap;padding:7px 10px;font-size:12.5px}
  .nav .cnt,.side .sep,.side .foot{display:none}
  .main{padding:14px 14px 50px}
  h1{font-size:22px}
  .qtext{font-size:17px}
  .opt{padding:12px}
}
@media print{
  .side,.topbar,.chips,.examnav,.dots,.no-print{display:none!important}
  .main{padding:0;max-width:none}
  .panel{box-shadow:none;border:0;padding:0}
  body::before{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">考</div>
      <div><b>品管考试</b><small>品管智能体 · 离线版</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sep"></div>
    <div class="foot">数据只存本机浏览器<br>题库版本 v1.0<br>更新 2026-10-23</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="search"><span style="color:var(--muted)">⌕</span><input id="search" placeholder="搜索工段或题目关键词…"></div>
      <div class="langseg" id="langseg">
        <button data-lang="bi">双语</button><button data-lang="zh">中文</button><button data-lang="km">ខ្មែរ</button>
      </div>
      <button class="iconbtn" id="theme">◐ 主题</button>
    </div>
    <div id="view"></div>
  </main>
</div>

/* ---------- helpers ---------- */
function optionText(o){ return lang==='km'?o.km:o.zh; }

function areaName(a){ return lang==='km'?a.name_km:a.name_zh; }

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function prepare(q){
  const tagged=q.options.map((o,i)=>({o,ok:i===q.answer}));
  const sh=shuffle(tagged);
  return Object.assign({},q,{options:sh.map(x=>x.o),answer:sh.findIndex(x=>x.ok)});
}
function pickForArea(a,n){
  const map=LS.get('qc_exam_used',{});
  let used=map[a.id]||[];
  const seen=new Set(used);
  let pool=a.questions.filter(q=>!seen.has(q.id));
  let reset=false;
  if(pool.length<n){ pool=a.questions.slice(); reset=true; }
  const picked=shuffle(pool).slice(0,n);
  const ids=picked.map(q=>q.id);
  used=reset?ids:used.concat(ids);
  map[a.id]=used; LS.set('qc_exam_used',map);
  return picked;
}
function scopeAreas(id){
  if(id==='all') return AREAS.map(a=>a.id);
  const d=DEPTS.find(x=>x.id===id);
  if(d) return d.areas.slice();
  return byId[id]?[id]:[];
}
function scopeTitle(id,l){
  l=l||lang;
  if(id==='all') return tt('allExam');
  const d=DEPTS.find(x=>x.id===id);
  if(d) return l==='km'?d.name_km:d.name_zh;
  const a=byId[id];
  return a?(l==='km'?a.name_km:a.name_zh):'考试';
}
function scopeTitleZh(id){
  if(id==='all') return '综合能力评估';
  const d=DEPTS.find(x=>x.id===id); if(d) return d.name_zh;
  return byId[id]?byId[id].name_zh:id;
}
function scopeDesc(id){
  const d=DEPTS.find(x=>x.id===id);
  if(d) return lang==='km'?d.desc_km:d.desc_zh;
  if(id==='all') return tt('allDesc');
  const a=byId[id]; return a?(lang==='km'?a.desc_km:a.desc_zh):'';
}
function scopeBank(id){
  return scopeAreas(id).reduce((n,aid)=>n+(byId[aid]?byId[aid].questions.length:0),0);
}
function drawQuestions(scopeId,count){
  const ids=scopeAreas(scopeId);
  if(ids.length===1) return pickForArea(byId[ids[0]],count).map(prepare);
  const per=Math.floor(count/ids.length), extra=count-per*ids.length;
  const order=shuffle(ids);
  let qs=order.flatMap((aid,i)=>pickForArea(byId[aid], per+(i<extra?1:0)));
  return shuffle(qs).map(prepare);
}

function renderSetup(scopeId){

function startExam(scopeId, count){

  route={name:'exam'};
  nav(scopeAreas(scopeId).length===1?scopeAreas(scopeId)[0]:'home');

    const left = sess.minutes*60 - Math.floor((Date.now()-sess.start)/1000);

  },1000);
}

  $('#view').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{sess.idx=Number(b.dataset.jump);renderExam()});
  if($('#prev')) $('#prev').onclick=()=>{if(sess.idx>0){sess.idx--;renderExam()}};
  if($('#next')) $('#next').onclick=()=>{if(sess.idx<sess.qs.length-1){sess.idx++;renderExam()}};
  $('#submit').onclick=()=>{
    const un=sess.answers.filter(v=>v<0).length;
    if(un && !confirm(tt('unanswered'))) return;
    if(!confirm(tt('confirmSubmit'))) return;
    submitExam(false);
  };
  const el=$('#timer'); if(el) el.textContent=fmtTime(left);
}
function submitExam(auto){
  if(!sess||sess.submitted) return;
  sess.submitted=true; sess.auto=!!auto;
  sess.elapsed = Math.floor((Date.now()-sess.start)/1000);
  clearInterval(timerId); timerId=null;
  const right = sess.qs.reduce((n,q,i)=>n+(sess.answers[i]===q.answer?1:0),0);
  const pct = Math.round(right/sess.qs.length*100);
  sess.right=right; sess.pct=pct;
  const rec = {
    ts:Date.now(), scopeId:sess.scopeId, scopeName:scopeTitle(sess.scopeId), scopeNameZh:scopeTitleZh(sess.scopeId),
    examineeName:sess.examinee&&sess.examinee.name||'', examineeId:sess.examinee&&sess.examinee.id||'',
    n:sess.qs.length, right, pct, pass:pct>=EXAM.meta.pass_score, elapsed:sess.elapsed
  };
  const hist=LS.get('qc_exam_history',[]); hist.unshift(rec); LS.set('qc_exam_history',hist.slice(0,100));
  route={name:'result'}; renderResult(auto);
}
function renderResult(auto){
  const _ids=sess?scopeAreas(sess.scopeId):[]; nav(_ids.length===1?_ids[0]:'home');
  const pass = sess.pct>=EXAM.meta.pass_score;
  const mins=Math.floor(sess.elapsed/60), secs=sess.elapsed%60;
  const title = scopeTitle(sess.scopeId);
  const wrong = sess.qs.map((q,i)=>({q,i})).filter(x=>sess.answers[x.i]!==x.q.answer);
  $('#view').innerHTML = `<div class="wrap">
    ${auto?`<div class="note" style="margin-bottom:14px">⏰ ${tt('timeup')}</div>`:''}
    <div class="panel">
      <div class="score">
        <div class="ring" style="--p:${sess.pct};--rc:${pass?'var(--ok)':'var(--danger)'}"><div style="text-align:center"><b>${sess.pct}%</b><br><small>${tt('score')}</small></div></div>
        <div style="flex:1;min-width:220px">
          <div class="verdict ${pass?'pass':'fail'}">${pass?tt('passTxt'):tt('failTxt')}</div>
          <div class="sub" style="margin:0">${esc(title)} · ${sess.qs.length} 题 · ${tt('pass')} ${EXAM.meta.pass_score}%${(sess.examinee&&(sess.examinee.name||sess.examinee.id))?` · ${tt('examinee')}：${esc(sess.examinee.name||'-')}${sess.examinee.id?`（${esc(sess.examinee.id)}）`:''}`:''}</div>
          <div class="statrow">
            <span class="stat"><b>${sess.right}</b> ${tt('correct')}</span>
            <span class="stat"><b>${sess.qs.length-sess.right}</b> 答错</span>
            <span class="stat"><b>${mins}</b>分${secs}秒</span>
            <span class="stat"><b>${sess.answers.filter(v=>v<0).length}</b> ${tt('noAns')}</span>
          </div>
        </div>
      </div>
      <div class="examnav no-print">
        <div><button class="btn primary" id="again">${tt('retry')}</button>
        ${wrong.length?`<button class="btn" id="wrongOnly">${tt('retryWrong')} (${wrong.length})</button>`:''}</div>
        <div><button class="btn" id="print">打印成绩</button><button class="btn" id="homeBtn">${tt('home2')}</button></div>
      </div>
      <div class="review"><h3 style="margin:6px 0 2px">${tt('review')}</h3>
        ${sess.qs.map((q,i)=>{
          const ua=sess.answers[i], ok=ua===q.answer;
          const qz = lang==='km'?q.q.km:q.q.zh, qsub = lang==='bi'?q.q.km:'';
          const opt=t=>lang==='km'?t.km:t.zh;
          const optsub=t=>lang==='bi'?t.km:'';
          return `<div class="rq"><div class="qt">${i+1}. ${esc(qz)}</div>
            ${qsub?`<div class="kmline">${esc(qsub)}</div>`:''}
            <div class="ans ${ok?'ok':'ng'}">${tt('yourAns')}：${ua>=0?esc('ABCD'[ua]+'. '+opt(q.options[ua])):tt('noAns')}${ua>=0&&optsub(q.options[ua])?`<br><span style="color:var(--muted);font-size:12.5px">${esc(optsub(q.options[ua]))}</span>`:''}</div>
            ${ok?'':`<div class="ans ok">${tt('rightAns')}：${esc('ABCD'[q.answer]+'. '+opt(q.options[q.answer]))}${optsub(q.options[q.answer])?`<br><span style="color:var(--muted);font-size:12.5px">${esc(optsub(q.options[q.answer]))}</span>`:''}</div>`}
            <div class="exp">💡 ${esc(lang==='km'?q.exp.km:q.exp.zh)}${lang==='bi'?`<br><span style="line-height:1.9;color:var(--muted)">${esc(q.exp.km)}</span>`:''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="note no-print" style="margin-top:14px">成绩已保存在本机浏览器。厂房共用设备时，请每次考完自行记录。</div>
  </div>`;
  $('#again').onclick=()=>startExam(sess.scopeId, sess.qs.length);
  if($('#wrongOnly')) $('#wrongOnly').onclick=()=>{
    const qs=wrong.map(x=>x.q);
    sess={scopeId:sess.scopeId,examinee:sess.examinee,qs,answers:new Array(qs.length).fill(-1),idx:0,start:Date.now(),minutes:Math.max(5,Math.ceil(qs.length*1.2)),elapsed:0,submitted:false};
    route={name:'exam'}; startExamAgain(qs,sess.minutes);
  };
  $('#print').onclick=()=>window.print();
  $('#homeBtn').onclick=()=>go({name:'home'});
}
function startExamAgain(qs,minutes){
  sess.qs=qs; sess.minutes=minutes; route={name:'exam'}; renderExam();
  timerId=setInterval(()=>{
    if(!sess||sess.submitted) return;
    const left=sess.minutes*60-Math.floor((Date.now()-sess.start)/1000);
    const el=$('#timer'); if(el) el.textContent=fmtTime(Math.max(0,left));
    if(left<=0){ clearInterval(timerId); timerId=null; submitExam(true); }
  },1000);
}
function renderHistory(){
  nav('history');
  const hist=LS.get('qc_exam_history',[]);
  const rows=hist.map(h=>{
    const who=[h.examineeName,h.examineeId].filter(Boolean).join(' / ');
    return `<div class="hrow">
      <div class="hs" style="color:${h.pass?'var(--ok)':'var(--danger)'}">${h.pct}%</div>
      <div class="hd"><b>${esc(h.scopeNameZh||h.areaNameZh||h.areaName||'考试')}</b><small>${new Date(h.ts).toLocaleString('zh-CN')} · ${h.n} 题 · ${Math.floor(h.elapsed/60)}分${h.elapsed%60}秒${who?` · ${esc(who)}`:''}</small></div>
      <span class="badge ${h.pass?'pass':'fail'}">${h.pass?'通过':'未通过'}</span></div>`;
  }).join('');
  $('#view').innerHTML=`<h1>${tt('history')}</h1><div class="sub">保存在本机浏览器，最多保留 100 次记录</div>`+
    (hist.length?`<div class="hist">${rows}</div>
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="exportCsv">${tt('exportCsv')}</button><button class="btn danger" id="clearHist">${tt('deleteHist')}</button></div>`
    :`<div class="empty">${tt('noHist')}</div>`);
  if($('#exportCsv')) $('#exportCsv').onclick=()=>{
    const head=['时间','部门/工段','考生','工号','题数','得分%','结果','用时(秒)'];
    const lines=[head].concat(hist.map(h=>[
      new Date(h.ts).toLocaleString('zh-CN'), h.scopeNameZh||h.areaNameZh||h.areaName||'',
      h.examineeName||'', h.examineeId||'', h.n, h.pct, h.pass?'通过':'未通过', h.elapsed
    ]));
    const csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='品管考试成绩_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  if($('#clearHist')) $('#clearHist').onclick=()=>{ if(confirm('确定清空所有考试记录？')){ LS.set('qc_exam_history',[]); renderHistory(); } };
}
function renderAbout(){
  nav('about');
  const total=AREAS.reduce((n,a)=>n+a.questions.length,0);
  $('#view').innerHTML=`<h1>${tt('about')}</h1><div class="sub">品管员工考核题库 · 中柬双语 · 离线单文件</div>
    <div class="panel" style="max-width:760px">
      <div class="note">题库逐条来自 <b>${esc(EXAM.meta.source)}</b>，按 ${DEPTS.length} 个部门组织、覆盖 ${AREAS.length} 个工段，共 <b>${total}</b> 题。每题 4 个选项、单一正确答案，合格线 ${EXAM.meta.pass_score}%。</div>
      <dl class="kv">
        <dt>${tt('source')}</dt><dd>${esc(EXAM.meta.source)}</dd>
        <dt>${tt('count')}</dt><dd>${AREAS.length} 工段 × 30 题 = ${total} 题（每次抽 10/20/30）</dd>
        <dt>${tt('passline')}</dt><dd>${EXAM.meta.pass_score}%</dd>
        <dt>版本</dt><dd>v${esc(EXAM.meta.version)} · 生成于 ${esc(EXAM.meta.build||'2026-10-23')}</dd>
        <dt>语言</dt><dd>${tt('langNote')}</dd>
      </dl>
      <div style="margin-top:16px" class="note">建议用法：新员工入职培训后按工段考核；在岗员工每季度用「综合考试」复训。错题会自动带解析，可点「只练错题」当场重做。</div>
    </div>`;
}
function go(r){
  route=r; clearInterval(timerId); timerId=null;
  if(r.name==='exam' && sess && !sess.submitted){ /* keep */ }
  render();
  if(r.name!=='exam') sess = sess && !sess.submitted ? sess : sess;
  if(r.name!=='exam' && r.name!=='result') sess=null;
}

/* ---------- boot ---------- */
document.querySelectorAll('#langseg button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$('#theme').onclick=()=>{
  const h=document.documentElement;
  const n=h.getAttribute('data-theme')==='dark'?'light':'dark';
  h.setAttribute('data-theme',n); LS.set('qc_exam_theme',n);
};
document.documentElement.setAttribute('data-theme',LS.get('qc_exam_theme','light'));
renderTopLang();
render();
</script>
</body>
</html>
